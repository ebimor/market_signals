version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: safeswing-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://safeswing:safeswing@postgres:5432/safeswing_db
      - DEBUG=False
      - API_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backend/safeswing.db:/app/safeswing.db
    networks:
      - safeswing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeswing-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - safeswing-network
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: safeswing-postgres
    environment:
      POSTGRES_USER: safeswing
      POSTGRES_PASSWORD: safeswing
      POSTGRES_DB: safeswing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safeswing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeswing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  safeswing-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
